name: Update news headlines

on:
  schedule:
    - cron: "30 1 * * *"   # daily, 07:00 IST; the page shows a rolling 7 days
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch headlines
        run: python3 news/fetch.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain news/news.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news/news.json
            git commit -m "News: update headlines"
            git pull --rebase -q
            git push
          fi
